config_version = "0"

exclude_patterns = [
  "**/build/**",
  "**/dist/**",
  "**/node_modules/**",
]

[file_types.osv-scanner]
# Qlty replaces this list, so retain its existing lockfile targets.
globs = [
  "**/conan.lock",
  "**/pubspec.lock",
  "**/mix.lock",
  "**/go.mod",
  "**/buildscript-gradle.lockfile",
  "**/gradle.lockfile",
  "**/gradle/verification-metadata.xml",
  "**/pom.xml",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/composer.lock",
  "**/Pipfile.lock",
  "**/poetry.lock",
  "**/requirements.txt",
  "**/pdm.lock",
  "**/renv.lock",
  "**/Gemfile.lock",
  "**/Cargo.lock",
  "**/Package.resolved",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "osv-scanner"
version = "2.4.0"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = ["lint"]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# The release scripts and their tests are maintainer-run, not shipped code.
# bandit flags asserts (B101) in the smoke tests, subprocess calls with fixed
# argv (B404/B603/B607), and ElementTree parsing of our own generated appcast
# (B314/B405). radarlint-python only raises style rules here (S1192, S3776,
# S3516). Ruff stays enabled for these paths.
[[exclude]]
plugins = ["bandit", "radarlint-python"]
file_patterns = ["scripts/**", "Tests/ReleaseTests/**"]
