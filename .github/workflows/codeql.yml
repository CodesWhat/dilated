name: CodeQL

# Swift analysis needs a macOS runner, so it runs weekly and on demand instead of
# on every push and pull request.
on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL Swift tracing doesn't support Xcode 27 and the image default can move,
      # so pin the newest Xcode 26. runs-on macos-26 is ARM (Intel CodeQL is deprecated).
      # Scheduled runs scan the default branch (main, the released code) on purpose.
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)
          [ -d "$xcode" ] || xcode=
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual

      - name: Build Swift package
        run: swift build

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
