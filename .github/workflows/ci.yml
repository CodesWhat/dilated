name: Swift CI
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The gate is skipped on push, so its output is empty there and the push-diff result is used.
      # Normalized so it is exactly 'true' or 'false': only an explicit 'false' skips verify.
      macos: ${{ (steps.gate.outputs.run || steps.filter.outputs.macos) == 'false' && 'false' || 'true' }}
    steps:
      - name: Gate pull requests on build inputs
        id: gate
        if: github.event_name == 'pull_request'
        uses: CodesWhat/.github/actions/changes-gate@159c667886c09a0d3109fa33f9b88e10903ea0bd
        with:
          patterns: |
            Sources/**
            Tests/**
            scripts/**
            packaging/**
            design/**
            **/*.swift
            **/*.plist
            **/*.entitlements
            Package.swift
            Package.resolved
            .github/workflows/**
            !**/*.md
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether macOS verify is needed
        id: filter
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF" = "refs/heads/main" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            range="$PUSH_BEFORE..$PUSH_SHA"
          fi
          if ! files=$(git diff --no-renames --name-only "$range"); then
            echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          macos=false
          if [ -z "$files" ]; then macos=true; fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              website/*|docs/*|*.md|.github/ISSUE_TEMPLATE/*|LICENSE) ;;
              *) macos=true ;;
            esac
          done <<< "$files"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system packages come preinstalled; apt installs on the bare runner can hang.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Website unit tests
        run: |
          node --test website/tests/*.test.mjs
          for m in website/dist/*.mjs website/dist/analytics/*.mjs; do node --check "$m"; done
      - name: Website browser checks
        working-directory: website
        env:
          HOME: /root
        run: |
          npm ci
          npx playwright test
  verify:
    needs: changes
    # Fail closed. A bare output check carries an implicit success(), so if `changes` fails, times
    # out or crashes, verify would be skipped, and a skipped job satisfies the required `verify`
    # check. Run unless `changes` succeeded and said 'false' explicitly.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.macos != 'false') }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: brew install xcodegen
      - name: Verify
        env:
          DILATED_COVERAGE: '1'
        run: bash scripts/verify.sh
      - name: MAS channel build and tests
        run: |
          bash scripts/check-mas-build.sh
          DILATED_CHANNEL=mas bash scripts/swift-test.sh --scratch-path .build-mas --filter MASChannel
          bash scripts/build-mas.sh --adhoc --output-dir "$RUNNER_TEMP/mas"
          python3 -I scripts/check-mas-bundle.py "$RUNNER_TEMP/mas/Dilated.app"
      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-reports
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .build/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
