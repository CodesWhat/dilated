name: Swift CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --arch arm64 --jobs 4
      - name: Test
        run: bash scripts/swift-test.sh --jobs 4
      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Assemble local app
        run: bash scripts/build-app.sh
