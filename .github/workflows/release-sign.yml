name: Release Sign

# Signs the DMG, ZIP and appcast already attached to a GitHub release with
# keyless cosign (*.sigstore.json bundles), attests build provenance for them,
# and attaches an SPDX SBOM generated from the tagged source, also attested.
# The original assets are only downloaded, never modified or re-uploaded, so
# Sparkle EdDSA signatures and notarization stay intact. Runs on Linux only.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sign, e.g. v1.0.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-sign-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write      # gh release upload of bundles and the SBOM
      id-token: write      # cosign keyless signing and attestation OIDC
      attestations: write  # attest-build-provenance and attest-sbom
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          # v<semver> with an optional prerelease. mas/* tags never match.
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing to sign unexpected release tag '${RELEASE_TAG}'"
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download release assets
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assets" "${RUNNER_TEMP}/sbom"
          # Only the DMG, ZIP and appcast. Checksums, the manifest and any
          # earlier bundles or SBOM are not signing subjects.
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/assets" \
            --pattern '*.dmg' --pattern '*.zip' --pattern 'appcast*.xml'
          ls -l "${RUNNER_TEMP}/assets"
          shopt -s nullglob
          if [ -z "$(printf '%s\n' "${RUNNER_TEMP}"/assets/*.dmg)" ] || [ -z "$(printf '%s\n' "${RUNNER_TEMP}"/assets/*.zip)" ]; then
            echo "::error::Release ${RELEASE_TAG} is missing its DMG or ZIP"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Sign assets
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bundles"
          for f in "${RUNNER_TEMP}"/assets/*; do
            cosign sign-blob --yes \
              --bundle "${RUNNER_TEMP}/bundles/$(basename "${f}").sigstore.json" "${f}"
          done

      - name: Require the run commit to be the tag's commit
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Provenance names the run's commit. The checkout above is the tag,
          # so HEAD is the tag's peeled commit. A dispatch from another ref
          # would attest the wrong source for these assets.
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "${RUN_SHA}" != "${tag_sha}" ]; then
            echo "::error::Run commit ${RUN_SHA} is not ${RELEASE_TAG} (${tag_sha}). Dispatch with --ref ${RELEASE_TAG}."
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom/dilated-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/assets/*.dmg
          sbom-path: ${{ runner.temp }}/sbom/dilated-${{ env.RELEASE_TAG }}.spdx.json

      - name: Upload bundles and SBOM
        run: |
          set -euo pipefail
          # --clobber replaces bundles and the SBOM from an earlier run of the
          # same tag, so re-runs and backfills converge.
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "${RUNNER_TEMP}"/bundles/*.sigstore.json \
            "${RUNNER_TEMP}"/sbom/*.spdx.json
